name: Deploy static site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
      - name: Repair and save Chromebook-friendly game rendering
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("index.html")
          source = path.read_text()
          nl = chr(10)
          source = source.replace("#undead-game-frame[hidden] { display:none!important; }", nl.join(["#undead-game-frame[hidden] { display:none!important; }", "#web-undead-frame { position:absolute; inset:0; z-index:51; width:100%; height:100%; border:0; background:#050606; }", "#game-container.is-web-undead > :not(#web-undead-frame) { display:none!important; }", "#web-undead-frame[hidden] { display:none!important; }"]))
          source = source.replace('            <button class="game-tab" type="button" onclick="event.stopImmediatePropagation(); showUndeadGame(this)">Undead Invasion</button>', nl.join(['            <button class="game-tab" type="button" onclick="event.stopImmediatePropagation(); showUndeadGame(this)">Undead Invasion</button>', '            <button class="game-tab" type="button" onclick="event.stopImmediatePropagation(); showWebUndeadGame(this)">Undead Invasion Online</button>']))
          source = source.replace('            <iframe id="undead-game-frame" src="undead-invasion.html?embedded=1" title="Undead Invasion" hidden></iframe>', nl.join(['            <iframe id="undead-game-frame" src="undead-invasion.html?embedded=1" title="Undead Invasion" hidden></iframe>', '            <iframe id="web-undead-frame" src="https://www.undead-invasion.com/" title="Undead Invasion Online" allow="fullscreen; autoplay" referrerpolicy="strict-origin-when-cross-origin" hidden></iframe>']))
          source = source.replace('const undeadFrame=document.getElementById(\'undead-game-frame\');', nl.join(["const undeadFrame=document.getElementById('undead-game-frame');", "const webUndeadFrame=document.getElementById('web-undead-frame');"]))
          source = source.replace("    if(typeof raidFiring!=='undefined')raidFiring=false;", "    if(typeof raidFiring!=='undefined')raidFiring=false;" + nl + "    closeWebUndeadGame();", 1)
          source = source.replace(nl.join(["    undeadFrame.hidden=false;undeadFrame.contentWindow?.postMessage('open-undead','*');document.title='Undead Invasion · Alpine Arcade';", "};", "function closeUndeadGame(){"]), nl.join(["    undeadFrame.hidden=false;undeadFrame.contentWindow?.postMessage('open-undead','*');document.title='Undead Invasion · Alpine Arcade';", "};", "window.showWebUndeadGame=function(button){", "    isPlaying=false;paused=false;cancelAnimationFrame(animationId);clearKeys();", "    if(typeof raidFiring!=='undefined')raidFiring=false;", "    closeUndeadGame();", "    document.querySelectorAll('.game-tab').forEach(tab=>tab.classList.toggle('active',tab===button));", "    currentGame='web-undead';arcadeGameContainer.classList.remove('is-zombies');arcadeGameContainer.classList.add('is-web-undead');", "    webUndeadFrame.hidden=false;document.title='Undead Invasion Online · Alpine Arcade';", "};", "function closeUndeadGame(){"]))
          source = source.replace(nl.join(["document.querySelectorAll('.game-tab[data-game]').forEach(tab=>tab.addEventListener('click',closeUndeadGame));", "document.getElementById('btn-exit-arcade').addEventListener('click',closeUndeadGame);"]), nl.join(["function closeWebUndeadGame(){", "    if(!arcadeGameContainer.classList.contains('is-web-undead'))return;", "    arcadeGameContainer.classList.remove('is-web-undead');webUndeadFrame.hidden=true;", "}", "document.querySelectorAll('.game-tab[data-game]').forEach(tab=>tab.addEventListener('click',()=>{closeUndeadGame();closeWebUndeadGame();}));", "document.getElementById('btn-exit-arcade').addEventListener('click',()=>{closeUndeadGame();closeWebUndeadGame();});"]))
          source = source.replace("                dfCurrentDriftPts += points;", chr(10).join(["                dfCurrentDriftPts += points;", "                // Bank drift score every physics step so the HUD cannot fall at drift end.", "                dfScore += points;"]))
          source = source.replace("                    dfScore += dfCurrentDriftPts;" + chr(10), "")
          source = source.replace("                    dfCurrentDriftPts = 0;", chr(10).join(["                    dfCurrentDriftPts = 0;", "                    // A new slide starts a fresh 100-point coin counter.", "                    dfDriftCoinProgress = 0;"]))
          source = source.replace('gameOver(dfScore + dfCurrentDriftPts, "A little too wild.")', 'gameOver(dfScore, "A little too wild.")')
          source = source.replace("                    dfScore += 100; " + chr(10), "")
          source = source.replace("Math.floor(dfScore+dfCurrentDriftPts).toLocaleString()", "Math.floor(dfScore).toLocaleString()")
          repairs = [
            ["        // Chromebooks usually have modest integrated graphics. Keep their simulation at", "        // full speed, but lower the pixels and frame rate the renderer has to fill.", "        const browserNavigator = typeof navigator === 'undefined' ? {} : navigator;", "        const lowPowerDevice = /CrOS/i.test(browserNavigator.userAgent || '') || (browserNavigator.deviceMemory && browserNavigator.deviceMemory <= 4) || (browserNavigator.hardwareConcurrency && browserNavigator.hardwareConcurrency <= 4);", "        function resizeCanvas() {"],
            ["                const pixelBudget = lowPowerDevice ? 540000 : 900000;", "                const scale = Math.min(preferred, 1280 / w, Math.sqrt(pixelBudget / (w * h)));"],
            ["            const renderInterval = lowPowerDevice ? 1000 / 30 : 1000 / 60;", "            if (!lastRender || now - lastRender >= renderInterval - 1) {"],
            ["            // Fewer distant scene cells on low-power machines: the fog already hides", "            // them, so this cuts city/desert geometry without changing the route.", "            const range=lowPowerDevice?820:1200;"],
          ]
          for lines in repairs:
              source = source.replace(r"\n".join(lines), "\n".join(lines))
          path.write_text(source)
          PY
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Chromebook rendering source formatting"
          git push
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload the static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
